<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".55" stop-color="#eee6d2"/>
      <stop offset="1" stop-color="#cfc5ae"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ed5b55"/>
      <stop offset="1" stop-color="#98242d"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#416d4d"/>
      <stop offset="1" stop-color="#17382d"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- soft emblem background -->
  <circle cx="400" cy="408" r="326" fill="#e8eee7"/>
  <circle cx="400" cy="408" r="302" fill="none" stroke="#c3d1c5" stroke-width="5" stroke-dasharray="5 15"/>

  <!-- festive sprigs behind the newspaper -->
  <g stroke="#315b43" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M125 530 Q170 460 220 405 M150 500 l-28 -35 M174 470 l-4 -42 M190 450 l34 -24"/>
    <path d="M675 530 Q630 460 580 405 M650 500 l28 -35 M626 470 l4 -42 M610 450 l-34 -24"/>
  </g>
  <g fill="#416d4d">
    <ellipse cx="128" cy="465" rx="13" ry="27" transform="rotate(-42 128 465)"/>
    <ellipse cx="170" cy="428" rx="13" ry="27" transform="rotate(-8 170 428)"/>
    <ellipse cx="218" cy="426" rx="13" ry="27" transform="rotate(55 218 426)"/>
    <ellipse cx="672" cy="465" rx="13" ry="27" transform="rotate(42 672 465)"/>
    <ellipse cx="630" cy="428" rx="13" ry="27" transform="rotate(8 630 428)"/>
    <ellipse cx="582" cy="426" rx="13" ry="27" transform="rotate(-55 582 426)"/>
  </g>
  <g fill="#b83236">
    <circle cx="145" cy="445" r="12"/><circle cx="165" cy="462" r="12"/><circle cx="655" cy="445" r="12"/><circle cx="635" cy="462" r="12"/>
  </g>

  <!-- soft shadow -->
  <ellipse cx="410" cy="690" rx="238" ry="35" fill="#24382e" opacity=".22" filter="url(#shadow)"/>

  <!-- newspaper sheet -->
  <path d="M218 170 Q400 142 582 170 L605 650 Q405 690 195 650 Z"
        fill="url(#paper)" stroke="#344b3d" stroke-width="15" stroke-linejoin="round"/>
  <path d="M238 190 Q400 167 562 190 L580 630 Q405 661 220 630 Z"
        fill="none" stroke="#c2b69d" stroke-width="4"/>

  <!-- folded top corner -->
  <path d="M518 166 L582 170 L585 238 L542 220 Z" fill="#d7cdb7" stroke="#344b3d" stroke-width="8" stroke-linejoin="round"/>
  <path d="M542 220 L585 238" stroke="#a99d84" stroke-width="5"/>

  <!-- masthead -->
  <text x="400" y="235" text-anchor="middle" font-family="Georgia, serif"
        font-size="35" font-weight="bold" letter-spacing="1" fill="#203d30">BOLLETTINO</text>
  <text x="400" y="272" text-anchor="middle" font-family="Georgia, serif"
        font-size="31" font-weight="bold" letter-spacing="2" fill="#b32e35">NATALIZIO</text>
  <path d="M245 291 H555" stroke="#344b3d" stroke-width="5"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="12" font-weight="bold" letter-spacing="2" fill="#596454">EDIZIONE SPECIALE  •  6 DICEMBRE 2026</text>

  <!-- urgent banner -->
  <path d="M236 340 L564 340 L552 405 L248 405 Z" fill="url(#red)" stroke="#7f2028" stroke-width="7" stroke-linejoin="round"/>
  <text x="400" y="382" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="25" font-weight="900" letter-spacing="1" fill="#fff8e9">ULTIM'ORA!</text>

  <!-- main headline -->
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif"
        font-size="26" font-weight="bold" fill="#243f32">È UFFICIALE:</text>
  <text x="400" y="482" text-anchor="middle" font-family="Georgia, serif"
        font-size="23" font-weight="bold" fill="#b32e35">MANCA SEMPRE MENO</text>
  <text x="400" y="515" text-anchor="middle" font-family="Georgia, serif"
        font-size="29" font-weight="bold" fill="#b32e35">A NATALE!</text>

  <!-- tiny festive illustration: tree and gifts -->
  <path d="M400 542 L365 592 H435 Z" fill="url(#green)" stroke="#18382d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M400 562 L353 620 H447 Z" fill="#315b43" stroke="#18382d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M400 585 L342 645 H458 Z" fill="url(#green)" stroke="#18382d" stroke-width="5" stroke-linejoin="round"/>
  <rect x="390" y="640" width="20" height="17" rx="2" fill="#8b573a"/>
  <path d="M400 532 l7 14 15 2 -11 10 3 15 -14 -8 -14 8 3 -15 -11 -10 15 -2z" fill="#d6ad58"/>
  <g fill="#d6ad58">
    <circle cx="382" cy="592" r="5"/><circle cx="421" cy="612" r="5"/><circle cx="390" cy="630" r="5"/>
  </g>
  <rect x="292" y="620" width="43" height="35" rx="3" fill="#b33238" stroke="#79232a" stroke-width="4"/>
  <path d="M309 620 V655 M292 633 H335" stroke="#f2d28a" stroke-width="6"/>
  <rect x="465" y="625" width="42" height="30" rx="3" fill="#315b43" stroke="#18382d" stroke-width="4"/>
  <path d="M481 625 V655 M465 637 H507" stroke="#d6ad58" stroke-width="6"/>

  <!-- small bells and sparkles -->
  <g fill="#d6ad58" stroke="#8d6c34" stroke-width="3">
    <path d="M176 300 Q176 280 194 280 Q212 280 212 300 L219 319 H169 Z"/>
    <circle cx="194" cy="324" r="6"/>
    <path d="M588 300 Q588 280 606 280 Q624 280 624 300 L631 319 H581 Z"/>
    <circle cx="606" cy="324" r="6"/>
  </g>
  <g fill="#d6ad58">
    <path d="M145 235 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <path d="M655 235 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <circle cx="155" cy="590" r="6"/><circle cx="645" cy="590" r="6"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f4e9"/>
      <stop offset=".35" stop-color="#aeb7b7"/>
      <stop offset=".68" stop-color="#e4e6dc"/>
      <stop offset="1" stop-color="#737f83"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315b43"/>
      <stop offset="1" stop-color="#102c24"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e94c4c"/>
      <stop offset="1" stop-color="#9d2029"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- soft badge background -->
  <circle cx="400" cy="414" r="318" fill="#e8eee7"/>
  <circle cx="400" cy="414" r="296" fill="none" stroke="#c3d1c5" stroke-width="5" stroke-dasharray="5 15"/>

  <!-- hood / cloak silhouette -->
  <path d="M190 330 Q205 150 400 142 Q595 150 610 330
           L674 650 Q540 730 400 730 Q260 730 126 650 Z"
        fill="url(#hood)" stroke="#102c24" stroke-width="14" stroke-linejoin="round"/>
  <path d="M222 342 Q240 186 400 178 Q560 186 578 342
           L625 627 Q520 687 400 690 Q280 687 175 627 Z"
        fill="none" stroke="#54765c" stroke-width="8" opacity=".7"/>

  <!-- Santa hat -->
  <path d="M242 214 Q277 64 495 78 Q559 82 610 149 Q526 137 459 187 Q390 237 310 251 Z"
        fill="url(#red)" stroke="#7f1b25" stroke-width="12" stroke-linejoin="round"/>
  <path d="M242 214 Q327 235 459 187 Q544 156 610 149 L628 205
           Q538 218 463 249 Q344 292 254 266 Z"
        fill="#f7f1e7" stroke="#d5d0c6" stroke-width="10" stroke-linejoin="round"/>
  <path d="M254 239 Q347 257 459 216 Q542 185 620 177" fill="none" stroke="#ffffff" stroke-width="8" opacity=".8"/>
  <circle cx="616" cy="151" r="43" fill="#fff8ed" stroke="#d5d0c6" stroke-width="10"/>
  <circle cx="605" cy="138" r="12" fill="#ffffff" opacity=".8"/>

  <!-- neck and shoulder armor -->
  <path d="M238 604 L294 665 L400 694 L506 665 L562 604 L550 722
           Q400 778 250 722 Z" fill="#253a36" stroke="#102c24" stroke-width="12"/>
  <path d="M292 650 L400 683 L508 650 L485 728 L400 750 L315 728 Z"
        fill="#788687" stroke="#354647" stroke-width="10"/>

  <!-- mask shadow -->
  <path d="M267 285 Q400 239 533 285 L557 438 Q544 566 400 633
           Q256 566 243 438 Z" fill="#071b18" opacity=".32" filter="url(#shadow)"/>

  <!-- metal face plate -->
  <path d="M267 277 Q400 236 533 277 L551 426
           Q543 548 400 616 Q257 548 249 426 Z"
        fill="url(#metal)" stroke="#3c4b4d" stroke-width="15" stroke-linejoin="round"/>
  <path d="M286 296 Q400 264 514 296 L526 420 Q518 526 400 584
           Q282 526 274 420 Z"
        fill="none" stroke="#ffffff" stroke-width="5" opacity=".6"/>

  <!-- brow and eye recesses -->
  <path d="M282 365 L375 382 L365 410 L278 399 Z" fill="#334346"/>
  <path d="M518 365 L425 382 L435 410 L522 399 Z" fill="#334346"/>
  <path d="M294 374 L366 390 L355 399 L291 389 Z" fill="#d9e3dc"/>
  <path d="M506 374 L434 390 L445 399 L509 389 Z" fill="#d9e3dc"/>
  <path d="M302 382 L353 393" stroke="#ffffff" stroke-width="4" opacity=".8"/>
  <path d="M498 382 L447 393" stroke="#ffffff" stroke-width="4" opacity=".8"/>

  <!-- nose bridge and cheek plates -->
  <path d="M400 365 L374 444 L400 469 L426 444 Z" fill="#879394" stroke="#465557" stroke-width="8"/>
  <path d="M278 423 L365 441 L354 504 L292 483 Z" fill="#a4adae" stroke="#566365" stroke-width="7"/>
  <path d="M522 423 L435 441 L446 504 L508 483 Z" fill="#a4adae" stroke="#566365" stroke-width="7"/>
  <path d="M286 435 L347 449 M514 435 L453 449" stroke="#edf0e8" stroke-width="5" opacity=".7"/>

  <!-- mouth grille -->
  <path d="M334 493 Q400 516 466 493 L451 559 Q400 585 349 559 Z"
        fill="#344447" stroke="#59686a" stroke-width="8"/>
  <path d="M355 514 L355 555 M377 520 L377 565 M400 523 L400 570 M423 520 L423 565 M445 514 L445 555"
        stroke="#c7d0ca" stroke-width="8" stroke-linecap="round"/>
  <path d="M345 505 Q400 527 455 505" fill="none" stroke="#f3f3e9" stroke-width="5" opacity=".8"/>

  <!-- rivets -->
  <g fill="#526163" stroke="#e7e9df" stroke-width="3">
    <circle cx="278" cy="325" r="8"/><circle cx="522" cy="325" r="8"/>
    <circle cx="270" cy="455" r="7"/><circle cx="530" cy="455" r="7"/>
    <circle cx="321" cy="565" r="7"/><circle cx="479" cy="565" r="7"/>
  </g>

  <!-- four-year insignia -->
  <circle cx="400" cy="666" r="43" fill="#d9bd79" stroke="#735c32" stroke-width="8"/>
  <circle cx="400" cy="666" r="33" fill="none" stroke="#fff0c6" stroke-width="3"/>
  <text x="400" y="679" text-anchor="middle" font-family="Georgia, serif"
        font-size="35" font-weight="bold" fill="#35423a">IV</text>

  <!-- tiny festive sparkles -->
  <g fill="#d9bd79">
    <path d="M145 333 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M646 355 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6z"/>
    <circle cx="185" cy="493" r="6"/><circle cx="620" cy="520" r="6"/>
  </g>
</svg>